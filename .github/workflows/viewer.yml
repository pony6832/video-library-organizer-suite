name: Viewer exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: viewer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/VideoLibraryViewer.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\VideoLibraryViewer.exe -ArgumentList '--no-browser','--port','8799' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            try { Invoke-RestMethod http://127.0.0.1:8799/api/status | Out-Null; $ok = $true; break } catch {}
          }
          $page = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/).StatusCode
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or $page -ne 200) { throw "exe 啟動失敗" }
      - uses: actions/upload-artifact@v4
        with:
          name: VideoLibraryViewer
          path: viewer/dist/VideoLibraryViewer.exe
